<div id="coursesDiv">
  <h1>Sök och sortera på kurser</h1>
  <p style="text-align:center;">Klicka på kolumn-namnen för att ändra ordning</p>
  <!--när användaren skriver i input, ta text som finns i fältet och skicka till setSearch()-->
  <input (input)="setSearch($event.target.value)" placeholder="Sök...">

  @if (loading()) {
    <p>Laddar...</p>
  } @else {

  <table>
    <thead>
      <tr>
        <th (click)="sortBy('code')">Kurskod <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
        <th (click)="sortBy('coursename')">Kursnamn <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
        <th (click)="sortBy('progression')">Progression <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
      </tr>
    </thead>

    <tbody>
      <!--for loop: gå igenom lista från filteredCourses(), använd kurskod som id för varje skapad rad-->
      @for (course of filteredCourses(); track course.code) {
        <tr>
          <td>{{ course.code }}</td>
          <td>{{ course.coursename }}</td>
          <td>{{ course.progression }}</td>
        </tr>
      }
    </tbody>
  </table>

  }
</div>
