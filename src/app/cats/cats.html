<div id="coursesDiv">
  <h1>Sök och sortera på katter</h1>
  <p style="text-align:center;">Jag testade att göra en liknande kurser, men använde <i>the Cat API</i> istället</p>
  <input (input)="setSearch($event.target.value)" placeholder="Sök...">

  <table>
    <thead>
      <tr>
        <th (click)="sortBy('id')">ID<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
        <th (click)="sortBy('name')">Ras<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
        <th  id="progressTh" (click)="sortBy('origin')">Land<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
        <th  (click)="sortBy('description')">Beskrivning<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2f4f4f"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg></th>
        </tr>
    </thead>

    <tbody>
      @for (cat of filteredCats(); track cat.id) {
        <tr>
          <td>{{ cat.id }}</td>
          <td>{{ cat.name }}</td>
          <td>{{ cat.origin }}</td>
          <td>{{ cat.description }}</td>
        </tr>
      }
    </tbody>
  </table>

</div>
